name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rust-build:
    name: Rust Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: wasm32-unknown-unknown
          override: true
      - name: Install Soroban CLI
        run: cargo install --locked soroban-cli
      - name: Build Soroban Contract
        run: soroban contract build

  rust-test:
    name: Rust Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
      - name: Run Cargo Test
        run: cargo test
        working-directory: contracts

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install requirements
        run: pip install black flake8
      - name: Format Check (Black)
        run: black --check src/ tests/
        working-directory: agent
      - name: Lint (Flake8)
        run: flake8 src/ tests/
        working-directory: agent

  python-typecheck:
    name: Python Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install requirements
        run: |
          pip install -r requirements.txt
          pip install mypy
        working-directory: agent
      - name: Type Check (Mypy)
        run: mypy src/ tests/
        working-directory: agent

  python-test:
    name: Python Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install requirements
        run: pip install -r requirements.txt pytest
        working-directory: agent
      - name: Run Pytest
        run: pytest
        working-directory: agent
